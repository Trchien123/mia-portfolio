    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Arm motion before first paint: hidden starting states apply only under html.js.
      window.__motionT0 = performance.now()
      if (
        'IntersectionObserver' in window &&
        !matchMedia('(prefers-reduced-motion: reduce)').matches
      ) {
        document.documentElement.classList.add('js')
        // Failsafe: if the app has not mounted (bundle failed), never leave content hidden.
        setTimeout(function () {
          if (!window.__appMounted) document.documentElement.classList.remove('js')
        }, 3000)
      }
    </script>
    <title>Hoang Minh Anh — Key Account Manager</title>
  </head>
