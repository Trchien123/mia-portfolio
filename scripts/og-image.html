<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Archivo';
    src: url('../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2') format('woff2');
    font-weight: 100 900;
    font-stretch: 62% 125%;
  }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #E8E9E5; position: relative; overflow: hidden;
    font-family: 'Archivo', sans-serif; color: #16140F; }
  .rail { position: absolute; left: 0; right: 0; top: 56px; height: 18px; background: #8A8B86; }
  .hook { position: absolute; top: 74px; width: 10px; height: 34px; background: #16140F; }
  .tag { position: absolute; left: 72px; top: 108px; width: 1056px; height: 450px; background: #F6CB2A;
    border: 8px solid #16140F; padding: 52px 64px; display: flex; flex-direction: column; justify-content: space-between; }
  .role { font-size: 34px; font-weight: 800; font-stretch: 75%; text-transform: uppercase; letter-spacing: 0.06em; }
  .name { font-size: 150px; line-height: 0.92; font-weight: 900; font-stretch: 62%; text-transform: uppercase; letter-spacing: -0.005em; }
  .lbl { display: inline-block; background: #16140F; color: #F6CB2A; padding: 2px 14px; margin-right: 24px; letter-spacing: 0.12em; }
  .brands { font-size: 30px; font-weight: 800; font-stretch: 75%; text-transform: uppercase; letter-spacing: 0.1em;
    border-top: 6px solid #16140F; padding-top: 22px; }
</style>
</head>
<body>
  <div class="rail"></div>
  <div class="hook" style="left: 190px"></div>
  <div class="hook" style="left: 1000px"></div>
  <div class="tag">
    <div class="role">Key Account Manager · DIGIWORLD</div>
    <div class="name">Hoang<br />Minh Anh</div>
    <div class="brands"><span class="lbl">Brands</span>ASUS · Xiaomi · Hisense · LG</div>
  </div>
</body>
</html>
